<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="395" viewBox="0 0 1200 395" role="img" aria-labelledby="title desc"><title id="title">月度业务流程</title><desc id="desc">维护基础资料、创建账套、汇入考勤、核对锁定、次月菜票核算，最后核对实际资金并归档备份。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8097b0" stroke-width="1"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><rect width="1200" height="395" rx="24" fill="#f6f8fb"/><text x="40" y="52" font-size="28" fill="#182f47" font-weight="650">一个月的业务，从这里开始</text><text x="40" y="83" font-size="17" fill="#60758a" font-weight="400">先核对考勤，再确认菜票；实际充值在外部软件完成，回到平台核对到账。</text><rect x="40" y="120" width="212" height="132" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="58" y="152" font-size="16" fill="#347b91" font-weight="600">01</text><text x="58" y="191" font-size="22" fill="#182f47" font-weight="600">维护资料</text><text x="58" y="224" font-size="14" fill="#60758a" font-weight="400">员工 / 部门 / 班次</text><path d="M252 185 L269 185" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="272" y="120" width="212" height="132" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="290" y="152" font-size="16" fill="#347b91" font-weight="600">02</text><text x="290" y="191" font-size="22" fill="#182f47" font-weight="600">准备账套</text><text x="290" y="224" font-size="14" fill="#60758a" font-weight="400">月份 / 厂休 / 福利</text><path d="M484 185 L501 185" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="504" y="120" width="212" height="132" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="522" y="152" font-size="16" fill="#347b91" font-weight="600">03</text><text x="522" y="191" font-size="22" fill="#182f47" font-weight="600">汇入考勤</text><text x="522" y="224" font-size="14" fill="#60758a" font-weight="400">归档重算 / 外部同步</text><path d="M716 185 L733 185" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="736" y="120" width="212" height="132" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="754" y="152" font-size="16" fill="#347b91" font-weight="600">04</text><text x="754" y="191" font-size="22" fill="#182f47" font-weight="600">核对并锁定</text><text x="754" y="224" font-size="14" fill="#60758a" font-weight="400">查询 / 修正 / 报表</text><path d="M948 185 L965 185" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="968" y="120" width="212" height="132" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="986" y="152" font-size="16" fill="#347b91" font-weight="600">05</text><text x="986" y="191" font-size="22" fill="#182f47" font-weight="600">核算菜票</text><text x="986" y="224" font-size="14" fill="#60758a" font-weight="400">次月发放 / 确认核算</text><rect x="40" y="285" width="1120" height="70" rx="16" fill="#eaf3f7" stroke="#dce5ee" stroke-width="1"/><text x="62" y="314" font-size="16" fill="#347b91" font-weight="600">后续闭环</text><text x="62" y="339" font-size="21" fill="#26364b" font-weight="400">导出充值表 → 外部充值 / 取款 → 核对真实流水 → 处理补扣差额 → 下载存档与备份</text></g></svg>