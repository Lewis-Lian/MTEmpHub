<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">MTEmpHub 系统架构</title><desc id="desc">Excel、SQL Server、钉钉通过后端进入月度账套与数据库，React 提供查询、核算、下载与备份入口。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8097b0" stroke-width="1"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><rect width="1200" height="490" rx="24" fill="#f6f8fb"/><text x="40" y="52" font-size="28" fill="#182f47" font-weight="650">数据如何流转</text><text x="40" y="83" font-size="17" fill="#60758a" font-weight="400">外部数据进入 Flask 服务，由月度账套组织，再交给查询、核算与归档。</text><rect x="40" y="125" width="285" height="85" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="60" y="158" font-size="20" fill="#26364b" font-weight="600">Excel 原始报表</text><text x="60" y="186" font-size="15" fill="#60758a" font-weight="400">日报 / 月报 / 请假 / 加班</text><path d="M325 167 L407 167" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="40" y="235" width="285" height="85" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="60" y="268" font-size="20" fill="#26364b" font-weight="600">SQL Server 考勤机</text><text x="60" y="296" font-size="15" fill="#60758a" font-weight="400">员工刷卡 / 菜票资金核对</text><path d="M325 277 L407 277" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="40" y="345" width="285" height="85" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="60" y="378" font-size="20" fill="#26364b" font-weight="600">钉钉</text><text x="60" y="406" font-size="15" fill="#60758a" font-weight="400">管理人员考勤</text><path d="M325 387 L407 387" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="410" y="125" width="350" height="305" rx="16" fill="#eaf3f7" stroke="#dce5ee" stroke-width="1"/><text x="435" y="166" font-size="23" fill="#182f47" font-weight="600">Flask API / 业务服务</text><text x="435" y="205" font-size="18" fill="#26364b" font-weight="400">认证与权限 · 导入与同步</text><text x="435" y="241" font-size="18" fill="#26364b" font-weight="400">考勤计算 · 修正 · 菜票对账</text><rect x="435" y="270" width="300" height="65" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="457" y="310" font-size="19" fill="#347b91" font-weight="600">月度账套 + 历史资料快照</text><text x="435" y="386" font-size="17" fill="#26364b" font-weight="400">SQLite / MySQL · 原始文件归档</text><path d="M760 235 L837 235" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="840" y="125" width="320" height="185" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="862" y="165" font-size="22" fill="#182f47" font-weight="600">React / TypeScript</text><text x="862" y="207" font-size="18" fill="#26364b" font-weight="400">查询中心 · 菜票中心</text><text x="862" y="242" font-size="18" fill="#26364b" font-weight="400">主数据 · 修正 · 系统设置</text><text x="862" y="279" font-size="18" fill="#26364b" font-weight="400">下载中心 · 消息</text><path d="M1000 310 L1000 345" stroke="#8097b0" stroke-width="1" fill="none" marker-end="url(#arrow)"/><rect x="840" y="350" width="320" height="80" rx="16" fill="#ffffff" stroke="#dce5ee" stroke-width="1"/><text x="862" y="382" font-size="20" fill="#26364b" font-weight="600">Excel 报表 / 月度 ZIP</text><text x="862" y="410" font-size="15" fill="#60758a" font-weight="400">存档下载 · 差异预览 · 选择恢复</text></g></svg>